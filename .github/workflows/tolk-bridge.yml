name: Tolk bridge (macOS)

# 把 Tolk 的 Mac 构建，按旧版 bagayalu 的 Sparkle 更新格式发布成本仓库的最新 Release，
# 让还在用 bagayalu 的用户点「检查更新」就升级成 Tolk。
# 签名证书和 Sparkle 私钥都用本仓库已有的 Secrets，私钥不出这个仓库。
# 先在 Achordchan/tolk 里运行 Release 工作流，得到 v<版本> 的 Release，再运行本工作流。

on:
  workflow_dispatch:
    inputs:
      version:
        description: Tolk 的版本号（如 2.0.0），对应 Achordchan/tolk 的 v2.0.0 Release
        required: true
        type: string
      replace_published:
        description: 本仓库已经发布过这个版本（比如发布出去的有问题）时，先删掉它再重发；不勾选就拒绝
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  bridge:
    # 这个工作流会用本仓库的证书和 Sparkle 私钥签名并发布"最新 Release"，只允许在默认分支上跑：
    # 手动触发时选了别的分支也会通过 workflow_dispatch，所以这里显式拦住。
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: macos-15
    # 和 build-macos.yml 的发布 job 共用同一个发布锁（线上构建号检查也在锁里）。
    concurrency:
      group: release-feed
      cancel-in-progress: false
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      # Tolk 仓库是私有时，在本仓库加一个只读令牌 TOLK_READ_TOKEN；公开后可以不配。
      TOLK_TOKEN: ${{ secrets.TOLK_READ_TOKEN || github.token }}
      # 用户的授权绑在这条身份要求上；对不上就失败，不发出去。
      EXPECTED_TEAM_ID: S336CKXSUQ
      EXPECTED_DESIGNATED_REQUIREMENT: 'identifier "achord.dazuofanyiguan" and anchor apple generic and certificate leaf[subject.CN] = "Apple Development: Chenchiyu chen (74524Q654V)" and certificate 1[field.1.2.840.113635.100.6.2.1] /* exists */'
    steps:
      - name: Check inputs
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "版本号必须是 x.y.z" >&2; exit 1; }
      - uses: actions/checkout@v4
      # Tolk 仓库的发布产物只当"数据"下载，不 checkout、不执行它的任何代码；
      # Sparkle 私钥只交给 Sparkle 官方的 sign_update（固定版本和哈希）。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verification dependencies
        run: python -m pip install "cryptography>=41.0.0"
      - name: Download Tolk's macOS app
        env:
          GH_TOKEN: ${{ env.TOLK_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist work
          gh release download "$TAG" --repo Achordchan/tolk --dir work --pattern "Tolk-${VERSION}-macos.zip"
          ditto -x -k "work/Tolk-${VERSION}-macos.zip" work/app
          APP="$(find work/app -maxdepth 2 -name '*.app' -print -quit)"
          [ -n "$APP" ] || { echo "压缩包里没有 .app" >&2; exit 1; }
          mv "$APP" "work/大佐翻译官v1.app"
          echo "APP=$GITHUB_WORKSPACE/work/大佐翻译官v1.app" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "work/大佐翻译官v1.app/Contents/Info.plist" | grep -qx 'achord.dazuofanyiguan'
          # 旧版 Sparkle 要求新应用带有和自己相同的 SUPublicEDKey，否则报"此更新未正确签名"。
          # Tolk 自己的更新器不用这个键，所以桥接版里写入旧版的公钥（取自本仓库的 Info.plist，重新签名之前改）。
          LEGACY_PUB="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' Configuration/App-Info.plist)"
          [ -n "$LEGACY_PUB" ] || { echo "读不到旧版 SUPublicEDKey" >&2; exit 1; }
          /usr/libexec/PlistBuddy -c "Delete :SUPublicEDKey" "work/大佐翻译官v1.app/Contents/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :SUPublicEDKey string $LEGACY_PUB" "work/大佐翻译官v1.app/Contents/Info.plist"
          # Sparkle 比较的是应用里的 CFBundleVersion，appcast 写的构建号必须和它一致，
          # 否则 appcast 说 20000、应用自己却是更小的号，会被 Sparkle 当成降级。
          BUILD="$(( ${VERSION%%.*} * 10000 + $(echo "$VERSION" | cut -d. -f2) * 100 + $(echo "$VERSION" | cut -d. -f3) ))"
          BUNDLE_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "work/大佐翻译官v1.app/Contents/Info.plist")"
          [ "$BUNDLE_BUILD" = "$BUILD" ] || { echo "应用的 CFBundleVersion=$BUNDLE_BUILD，与要写进 appcast 的构建号 $BUILD 不一致" >&2; exit 1; }
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          # 压缩包里取出的路径不写进 $GITHUB_ENV（路径里的换行可以注入环境变量）；后面的步骤各自在 shell 变量里重新查找。
          [ -n "$(find "work/大佐翻译官v1.app" -name tolk-helper -type f -print -quit)" ] || { echo "应用里没有 tolk-helper" >&2; exit 1; }
      - name: Re-sign with this repo's Apple Development certificate
        env:
          SIGNING_CERT_P12_BASE64: ${{ secrets.MACOS_DEV_CERT_P12_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_DEV_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${SIGNING_CERT_P12_BASE64:-}" ] && [ -n "${SIGNING_CERT_PASSWORD:-}" ] || { echo "缺少 MACOS_DEV_CERT_P12_BASE64 / MACOS_DEV_CERT_PASSWORD" >&2; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          P12="$RUNNER_TEMP/signing.p12"
          ORIGINAL_KEYCHAINS=()
          while IFS= read -r line; do
            line="$(printf '%s' "$line" | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//')"
            [ -n "$line" ] && ORIGINAL_KEYCHAINS+=("$line")
          done < <(security list-keychains -d user)
          cleanup() {
            set +e
            security list-keychains -d user -s ${ORIGINAL_KEYCHAINS[@]+"${ORIGINAL_KEYCHAINS[@]}"}
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1
            rm -f "$P12"
          }
          trap cleanup EXIT
          printf '%s' "$SIGNING_CERT_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign >/dev/null
          WWDR_CERT="scripts/certs/AppleWWDRCAG3.cer"
          [ "$(shasum -a 256 "$WWDR_CERT" | awk '{ print $1 }')" = "dcf21878c77f4198e4b4614f03d696d89c66c66008d4244e1b99161aac91601f" ] || { echo "中间证书指纹不对" >&2; exit 1; }
          security import "$WWDR_CERT" -k "$KEYCHAIN" >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" ${ORIGINAL_KEYCHAINS[@]+"${ORIGINAL_KEYCHAINS[@]}"}
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/"Apple Development:/ { print $2; exit }')"
          [ -n "$IDENTITY" ] || { echo "没有有效的 Apple Development 签名身份" >&2; exit 1; }
          HELPER="$(find "$APP" -name tolk-helper -type f -print -quit)"
          [ -n "$HELPER" ] || { echo "应用里没有 tolk-helper" >&2; exit 1; }
          codesign --force --sign "$IDENTITY" --timestamp=none "$HELPER"
          codesign --force --deep --sign "$IDENTITY" --timestamp=none "$APP"
      - name: Verify the identity is unchanged
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP"
          INFO="$(codesign -dv --verbose=4 "$APP" 2>&1)"
          ! grep -q 'flags=.*adhoc' <<< "$INFO" || { echo "仍是 ad-hoc 签名" >&2; exit 1; }
          ! grep -q 'flags=.*runtime' <<< "$INFO" || { echo "不应启用 hardened runtime" >&2; exit 1; }
          [ "$(sed -n 's/^TeamIdentifier=//p' <<< "$INFO")" = "$EXPECTED_TEAM_ID" ] || { echo "TeamIdentifier 不对" >&2; exit 1; }
          ACTUAL="$(codesign -d -r- "$APP" 2>&1 | sed -n 's/^.*designated => //p')"
          [ "$ACTUAL" = "$EXPECTED_DESIGNATED_REQUIREMENT" ] || { echo "签名身份要求与固定值不一致：$ACTUAL" >&2; exit 1; }
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")")"
          grep -q arm64 <<< "$ARCHS" && grep -q x86_64 <<< "$ARCHS" || { echo "不是通用二进制：$ARCHS" >&2; exit 1; }
          HELPER="$(find "$APP" -name tolk-helper -type f -print -quit)"
          HELPER_ARCHS="$(lipo -archs "$HELPER")"
          grep -q arm64 <<< "$HELPER_ARCHS" && grep -q x86_64 <<< "$HELPER_ARCHS" || { echo "tolk-helper 不是通用二进制：$HELPER_ARCHS" >&2; exit 1; }
      - name: Package, sign the appcast and publish
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "缺少 SPARKLE_PRIVATE_KEY" >&2; exit 1; }
          # 只有"本仓库当前最新的就是这个 tag"时才允许替换：不会删掉不在线上的旧版本，也不会动更新源里更新的版本。
          REPLACING=false
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            [ "${{ inputs.replace_published }}" = "true" ] || { echo "$TAG 已存在，请提升版本号（或勾选 replace_published 删掉重发）" >&2; exit 1; }
            LATEST_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
            [ "$LATEST_TAG" = "$TAG" ] || { echo "最新 Release 是 $LATEST_TAG，不是 $TAG，只能替换当前的最新 Release" >&2; exit 1; }
            REPLACING=true
          fi
          # Sparkle 比较构建号，必须大于线上已有的（旧版最高 141）：先看线上现在的 appcast，
          # 不是严格更大就拒绝，免得补发旧版本把更新源倒退，藏掉已经发布的新版本。
          # 取不到或解析不出线上构建号时一律失败，不当成"没有旧版本"放行（本仓库一直有旧版 appcast）。
          # 替换最新 Release 时，线上那个就是同一个版本，构建号相等是预期的。
          APPCAST="$RUNNER_TEMP/live-appcast.xml"
          curl -fsSL --retry 3 --retry-delay 2 -o "$APPCAST" "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml" \
            || { echo "拿不到线上 appcast，无法确认构建号不会倒退，已停止" >&2; exit 1; }
          LIVE="$(sed -n 's|.*<sparkle:version>\([0-9][0-9]*\)</sparkle:version>.*|\1|p' "$APPCAST" | sort -n | tail -1)"
          [[ "$LIVE" =~ ^[0-9]+$ ]] || { echo "线上 appcast 里读不到构建号，已停止" >&2; exit 1; }
          if [ "$REPLACING" = true ]; then
            [ "$BUILD" -ge "$LIVE" ] || { echo "线上 appcast 的构建号是 $LIVE，大于要发布的 $BUILD，拒绝" >&2; exit 1; }
          elif [ "$BUILD" -le "$LIVE" ]; then
            echo "线上 appcast 的构建号是 $LIVE，要发布的 $BUILD 不是严格更大，拒绝（避免更新源倒退）" >&2; exit 1
          fi
          ZIP="bagayalu-translate-v${VERSION}-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/$ZIP"
          ROOT="$RUNNER_TEMP/dmg-root"; mkdir -p "$ROOT"
          ditto "$APP" "$ROOT/Tolk.app"; ln -s /Applications "$ROOT/Applications"
          hdiutil create -volname "Tolk $VERSION" -srcfolder "$ROOT" -ov -format UDZO "dist/Tolk-${VERSION}-macos.dmg"
          GH_TOKEN="$TOLK_TOKEN" gh release view "$TAG" --repo Achordchan/tolk --json body -q .body | grep -Evi 'DZFYQ-SIG|^update=' > dist/release-notes.md || true
          [ -s dist/release-notes.md ] || { echo "发布说明为空" >&2; exit 1; }
          SPARKLE_VERSION=2.9.4
          SPARKLE_SHA256=ce89daf967db1e1893ed3ebd67575ed82d3902563e3191ca92aaec9164fbdef9
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sparkle.tar.xz" "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          [ "$(shasum -a 256 "$RUNNER_TEMP/sparkle.tar.xz" | awk '{ print $1 }')" = "$SPARKLE_SHA256" ] || { echo "Sparkle 压缩包哈希不对" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          SIGN_OUT="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file - "dist/$ZIP")"
          SIG="$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' <<< "$SIGN_OUT")"
          [ -n "$SIG" ] || { echo "sign_update 没有给出签名" >&2; exit 1; }
          PUB="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' Configuration/App-Info.plist)"
          # 自检：签名必须能被旧版 bagayalu 内置的 SUPublicEDKey 验证，私钥不对会在这里失败。
          # 最低系统版本：以应用自己声明的为准；没声明就用旧版 bagayalu 的最低要求 15.1（不会把任何旧用户排除在外）。
          MIN_OS="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist" 2>/dev/null || echo 15.1)"
          [[ "$MIN_OS" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || { echo "LSMinimumSystemVersion 格式不对：$MIN_OS" >&2; exit 1; }
          python3 scripts/bridge_appcast.py --zip "dist/$ZIP" --version "$VERSION" --build "$BUILD" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ZIP" \
            --notes dist/release-notes.md --signature "$SIG" --pub "$PUB" --min-os "$MIN_OS" --out dist/appcast.xml
          xmllint --noout dist/appcast.xml
          # 到这里新的产物都已经生成并验过签。替换时先把旧 Release 的文件和说明备份下来，
          # 删除之后如果新的发布失败，就用备份把旧的恢复回去。
          if [ "$REPLACING" = true ]; then
            BACKUP="$RUNNER_TEMP/release-backup"; mkdir -p "$BACKUP"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$BACKUP"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > "$BACKUP/notes.md"
            ls "$BACKUP"/* | grep -v '/notes.md$' > "$BACKUP/files.txt"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          if ! gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Tolk $TAG" --notes-file dist/release-notes.md --latest \
            "dist/$ZIP" "dist/Tolk-${VERSION}-macos.dmg" dist/appcast.xml; then
            if [ "$REPLACING" = true ]; then
              echo "发布失败，正在用备份恢复旧的 $TAG" >&2
              # 新建失败时可能留下半成品（草稿或缺文件的 Release），先清掉再恢复；macOS 自带 Bash 3.2 没有 mapfile。
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
              OLD_FILES=()
              while IFS= read -r f; do OLD_FILES+=("$f"); done < "$BACKUP/files.txt"
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Tolk $TAG" --notes-file "$BACKUP/notes.md" --latest "${OLD_FILES[@]}" || echo "恢复也失败了，需要手动处理" >&2
            fi
            exit 1
          fi
