name: Build and Release macOS

on:
  push:
    branches:
      - main
  # PR 也跑一遍构建和签名校验（不发布）：证书、签名身份要求有问题，合并前就能看到。
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 要发布的版本号，必须与 Xcode 中的 MARKETING_VERSION 一致
        required: true
        default: 1.2.5
        type: string

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-15
    permissions:
      contents: read

    env:
      XCODE_PROJECT: 大佐翻译官v1.xcodeproj
      XCODE_SCHEME: dazuofanyiguan
      XCODE_TARGET: 大佐翻译官v1
      APP_NAME: 大佐翻译官v1
      DERIVED_DATA_PATH: build
      BUILD_PRODUCTS_PATH: build-products
      RELEASE_VERSION: ${{ inputs.version }}
      BUNDLE_IDENTIFIER: achord.dazuofanyiguan
      # 发布包用作者免费 Apple ID 自带的 Apple Development 证书签名（私钥只在 Secrets 里）。
      # 以前的自签名证书能保住辅助功能授权，但钥匙串对非 Apple 签发的证书一律按 cdhash 认 App，
      # 每次更新读 API Key 都要弹框输登录密码；Apple Development 证书下钥匙串按团队 ID 认，跨版本不变。
      # 用户的授权绑在下面这条身份要求上：它只认「Apple 签发 + 证书名」，证书一年一续、名字不变，续签不影响用户。
      # 换团队或换证书名 = 所有用户重新授权一次，所以写死在这里，对不上就构建失败。
      EXPECTED_TEAM_ID: S336CKXSUQ
      EXPECTED_DESIGNATED_REQUIREMENT: 'identifier "achord.dazuofanyiguan" and anchor apple generic and certificate leaf[subject.CN] = "Apple Development: Chenchiyu chen (74524Q654V)" and certificate 1[field.1.2.840.113635.100.6.2.1] /* exists */'

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate release version
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail

          PROJECT_VERSION="$(
            xcodebuild \
              -project "$XCODE_PROJECT" \
              -target "$XCODE_TARGET" \
              -configuration Release \
              -showBuildSettings |
            awk '/MARKETING_VERSION =/ { print $3; exit }'
          )"
          PROJECT_BUILD="$(
            xcodebuild \
              -project "$XCODE_PROJECT" \
              -target "$XCODE_TARGET" \
              -configuration Release \
              -showBuildSettings |
            awk '/CURRENT_PROJECT_VERSION =/ { print $3; exit }'
          )"

          if [ -z "$RELEASE_VERSION" ]; then
            echo "发布版本号不能为空。" >&2
            exit 1
          fi

          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "发布版本号必须使用 x.y.z 格式。" >&2
            exit 1
          fi

          if [ "$PROJECT_VERSION" != "$RELEASE_VERSION" ]; then
            echo "工作流版本 $RELEASE_VERSION 与项目版本 $PROJECT_VERSION 不一致。" >&2
            exit 1
          fi

          if ! [[ "$PROJECT_BUILD" =~ ^[0-9]+$ ]] || [ "$PROJECT_BUILD" -le 0 ]; then
            echo "CURRENT_PROJECT_VERSION 必须是正整数。" >&2
            exit 1
          fi

          LATEST_APPCAST="$RUNNER_TEMP/latest-appcast.xml"
          if curl --fail --location --silent --show-error \
            "https://github.com/Achordchan/bagayalu-translate/releases/latest/download/appcast.xml" \
            --output "$LATEST_APPCAST"; then
            LATEST_BUILD="$(
              sed -n 's|.*<sparkle:version>\\([^<]*\\)</sparkle:version>.*|\\1|p' \
                "$LATEST_APPCAST" |
              head -1
            )"
            if [[ "$LATEST_BUILD" =~ ^[0-9]+$ ]] && [ "$PROJECT_BUILD" -le "$LATEST_BUILD" ]; then
              echo "构建号 $PROJECT_BUILD 必须大于线上构建号 $LATEST_BUILD。" >&2
              exit 1
            fi
          fi

          TAG="v$RELEASE_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG 已存在，请提升版本号后重新发布。" >&2
            exit 1
          fi

      - name: Build architecture-specific Release apps
        run: |
          set -euo pipefail

          SIGNING_ARGUMENTS=(
            "CODE_SIGNING_ALLOWED=NO"
            "CODE_SIGNING_REQUIRED=NO"
          )

          for ARCH in arm64 x86_64; do
            OUTPUT_PATH="$GITHUB_WORKSPACE/$BUILD_PRODUCTS_PATH/$ARCH"
            xcodebuild \
              -project "$XCODE_PROJECT" \
              -scheme "$XCODE_SCHEME" \
              -configuration Release \
              -destination "generic/platform=macOS" \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              ARCHS="$ARCH" \
              ONLY_ACTIVE_ARCH=YES \
              CONFIGURATION_BUILD_DIR="$OUTPUT_PATH" \
              "${SIGNING_ARGUMENTS[@]}" \
              build
          done

      - name: Sign release app bundles with the Apple Development certificate
        env:
          SIGNING_CERT_P12_BASE64: ${{ secrets.MACOS_DEV_CERT_P12_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_DEV_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${SIGNING_CERT_P12_BASE64:-}" ] || [ -z "${SIGNING_CERT_PASSWORD:-}" ]; then
            echo "缺少签名证书 Secret：MACOS_DEV_CERT_P12_BASE64 / MACOS_DEV_CERT_PASSWORD（配置方法见 README「发布与更新签名」）。" >&2
            echo "不能退回 ad-hoc 或自签名：那会让所有用户已给的辅助功能、屏幕录制授权失效。" >&2
            echo "从 fork 发起的 PR 拿不到仓库 Secret，会停在这里，属预期。" >&2
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          P12="$RUNNER_TEMP/signing.p12"

          ORIGINAL_KEYCHAINS=()
          while IFS= read -r line; do
            line="$(printf '%s' "$line" | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//')"
            [ -n "$line" ] && ORIGINAL_KEYCHAINS+=("$line")
          done < <(security list-keychains -d user)

          # 私钥只在这一步里存在：签完（包括失败）立刻删钥匙串、删 p12、恢复搜索列表。
          cleanup() {
            set +e
            security list-keychains -d user -s ${ORIGINAL_KEYCHAINS[@]+"${ORIGINAL_KEYCHAINS[@]}"}
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1
            rm -f "$P12"
          }
          trap cleanup EXIT

          printf '%s' "$SIGNING_CERT_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign >/dev/null
          # 导出的 p12 只带叶子证书；中间证书自己带上，不赌 runner 镜像里有没有。
          # 导入前核对 SHA-256（Apple PKI 页面公布的 WWDR G3 指纹），文件缺了或被换了都在这里说清楚。
          WWDR_CERT="scripts/certs/AppleWWDRCAG3.cer"
          WWDR_SHA256="dcf21878c77f4198e4b4614f03d696d89c66c66008d4244e1b99161aac91601f"
          if [ ! -f "$WWDR_CERT" ]; then
            echo "找不到中间证书 $WWDR_CERT。" >&2
            exit 1
          fi
          ACTUAL_WWDR_SHA256="$(shasum -a 256 "$WWDR_CERT" | awk '{ print $1 }')"
          if [ "$ACTUAL_WWDR_SHA256" != "$WWDR_SHA256" ]; then
            echo "中间证书 $WWDR_CERT 的 SHA-256 是 ${ACTUAL_WWDR_SHA256}，要的是 ${WWDR_SHA256}。" >&2
            exit 1
          fi
          security import "$WWDR_CERT" -k "$KEYCHAIN" >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # codesign 只在钥匙串搜索列表里找签名身份，--keychain 指定文件也找不到。
          security list-keychains -d user -s "$KEYCHAIN" ${ORIGINAL_KEYCHAINS[@]+"${ORIGINAL_KEYCHAINS[@]}"}

          # 按 SHA-1 取临时钥匙串里的那张：runner 的其他钥匙串里就算有同名证书，也不会被选中。
          # 证书一年一续，SHA-1 每次都变，所以不写死；身份对不对由下一步的身份要求校验把关。
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/"Apple Development:/ { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then
            echo "导入的证书里没有有效的 Apple Development 签名身份（过期了？导出时没带私钥？）。" >&2
            security find-identity -p codesigning "$KEYCHAIN" >&2 || true
            exit 1
          fi

          # 到期提醒：证书一年一续，过期后就签不出包了。
          CERT_PEM="$(security find-certificate -a -Z -p "$KEYCHAIN" | awk -v id="$IDENTITY" '
            /^SHA-1 hash:/ { keep = ($3 == id) }
            keep && /BEGIN CERTIFICATE/ { on = 1 }
            keep && on { print }
            keep && on && /END CERTIFICATE/ { exit }')"
          if [ -z "$CERT_PEM" ]; then
            echo "::warning::读不出签名证书的到期日"
          else
            NOT_AFTER="$(openssl x509 -noout -enddate <<< "$CERT_PEM" | sed 's/^notAfter=//')"
            echo "签名身份 ${IDENTITY}，证书到期：${NOT_AFTER}"
            if ! openssl x509 -noout -checkend 2592000 <<< "$CERT_PEM" >/dev/null; then
              echo "::warning::签名证书 30 天内到期（${NOT_AFTER}）：在 Xcode → 设置 → 账户里续一张，重新导出 p12 更新 MACOS_DEV_CERT_P12_BASE64 / MACOS_DEV_CERT_PASSWORD"
            fi
          fi

          for ARCH in arm64 x86_64; do
            APP_PATH="$BUILD_PRODUCTS_PATH/$ARCH/$APP_NAME.app"
            # --deep 连 Sparkle 的框架、Autoupdate、Updater.app、XPC 一起重签，整包同一个团队。
            codesign \
              --force \
              --deep \
              --sign "$IDENTITY" \
              --timestamp=none \
              "$APP_PATH"
          done

      - name: Verify update configuration, signatures, and architectures
        run: |
          set -euo pipefail

          for ARCH in arm64 x86_64; do
            APP_PATH="$BUILD_PRODUCTS_PATH/$ARCH/$APP_NAME.app"

            if [ ! -d "$APP_PATH" ]; then
              echo "找不到 $ARCH 构建产物：$APP_PATH" >&2
              exit 1
            fi

            ARCHITECTURES="$(lipo -archs "$APP_PATH/Contents/MacOS/$APP_NAME")"
            echo "$ARCH 构建架构：$ARCHITECTURES"
            [ "$ARCHITECTURES" = "$ARCH" ]

            codesign --verify --deep --strict --verbose=4 "$APP_PATH"

            SIGNATURE_INFO="$(codesign -dv --verbose=4 "$APP_PATH" 2>&1)"
            printf '%s\n' "$SIGNATURE_INFO"
            if grep -q 'flags=.*adhoc' <<< "$SIGNATURE_INFO"; then
              echo "$ARCH 仍是 ad-hoc 签名。发布包必须用固定证书签名，否则用户每次更新都要重新授权。" >&2
              exit 1
            fi
            # 这次只换签名身份，不顺手开 hardened runtime：它会改变运行时行为，要开另起一个 PR 单独验证。
            if grep -q 'flags=.*runtime' <<< "$SIGNATURE_INFO"; then
              echo "$ARCH 不应启用 hardened runtime。" >&2
              exit 1
            fi
            grep -q 'Authority=Apple Development: ' <<< "$SIGNATURE_INFO"
            grep -q 'Info.plist entries=' <<< "$SIGNATURE_INFO"
            grep -q 'Sealed Resources version=2' <<< "$SIGNATURE_INFO"
            # 钥匙串按团队 ID 认 App：团队一变，所有用户更新完又要输一次登录钥匙串密码。
            ACTUAL_TEAM="$(sed -n 's/^TeamIdentifier=//p' <<< "$SIGNATURE_INFO")"
            if [ "$ACTUAL_TEAM" != "$EXPECTED_TEAM_ID" ]; then
              echo "$ARCH TeamIdentifier 是「${ACTUAL_TEAM:-读不出}」，要的是 $EXPECTED_TEAM_ID。" >&2
              exit 1
            fi

            # 用户的授权绑在这条身份要求上。它一变，所有人都要重新授权——宁可构建失败，也不能悄悄发出去。
            ACTUAL_REQUIREMENT="$(codesign -d -r- "$APP_PATH" 2>&1 | sed -n 's/^.*designated => //p')"
            if [ "$ACTUAL_REQUIREMENT" != "$EXPECTED_DESIGNATED_REQUIREMENT" ]; then
              echo "$ARCH 签名身份要求与固定值不一致。" >&2
              echo "  预期：$EXPECTED_DESIGNATED_REQUIREMENT" >&2
              echo "  实际：$ACTUAL_REQUIREMENT" >&2
              exit 1
            fi

            if /usr/libexec/PlistBuddy \
              -c 'Print :SUEnableInstallerLauncherService' \
              "$APP_PATH/Contents/Info.plist" >/dev/null 2>&1; then
              echo "$ARCH 主程序不应启用 sandbox InstallerLauncher XPC。" >&2
              exit 1
            fi

            ENTITLEMENTS="$(codesign -d --entitlements :- "$APP_PATH" 2>/dev/null || true)"
            if grep -q 'com.apple.security.app-sandbox' <<< "$ENTITLEMENTS"; then
              echo "$ARCH 主程序不应包含 App Sandbox 权限。" >&2
              exit 1
            fi

            # Xcode 复制 XCFramework 时会去掉开发头文件，因此框架主体忽略资源封装检查；
            # 主二进制和所有实际执行的 Sparkle 辅助组件仍必须通过代码签名校验。
            codesign --verify --strict --ignore-resources --verbose=4 \
              "$APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle"

            for COMPONENT in \
              "$APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app" \
              "$APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate" \
              "$APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Downloader.xpc" \
              "$APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Installer.xpc"; do
              codesign --verify --strict --verbose=4 "$COMPONENT"
            done

            # 嵌套代码要和主程序同一个团队：--deep 漏签一个，更新时那一环就会被系统拒绝。
            for COMPONENT in \
              "$APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle" \
              "$APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app" \
              "$APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate" \
              "$APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Downloader.xpc" \
              "$APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Installer.xpc"; do
              COMPONENT_TEAM="$(codesign -dv "$COMPONENT" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
              if [ "$COMPONENT_TEAM" != "$EXPECTED_TEAM_ID" ]; then
                echo "$ARCH $COMPONENT 的 TeamIdentifier 是「${COMPONENT_TEAM:-读不出}」，要的是 $EXPECTED_TEAM_ID。" >&2
                exit 1
              fi
            done
          done

          HOST_ARCH="$(uname -m)"
          APP_PATH="$BUILD_PRODUCTS_PATH/$HOST_ARCH/$APP_NAME.app"
          LAUNCH_LOG="$RUNNER_TEMP/$APP_NAME-$HOST_ARCH-launch.log"
          "$APP_PATH/Contents/MacOS/$APP_NAME" >"$LAUNCH_LOG" 2>&1 &
          APP_PID=$!
          sleep 5

          if ! kill -0 "$APP_PID" 2>/dev/null; then
            wait "$APP_PID" || true
            echo "$HOST_ARCH 发布包启动后提前退出。" >&2
            cat "$LAUNCH_LOG" >&2
            exit 1
          fi

          kill -TERM "$APP_PID"
          wait "$APP_PID" || true

      - name: Package app and DMG
        run: |
          set -euo pipefail

          ARM64_APP_PATH="$BUILD_PRODUCTS_PATH/arm64/$APP_NAME.app"
          VERSION="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleShortVersionString' \
              "$ARM64_APP_PATH/Contents/Info.plist"
          )"

          mkdir -p dist/update

          for ARCH in arm64 x86_64; do
            APP_PATH="$BUILD_PRODUCTS_PATH/$ARCH/$APP_NAME.app"
            ARCHIVE_NAME="bagayalu-translate-v$VERSION-$ARCH.zip"
            DMG_NAME="bagayalu-translate-v$VERSION-$ARCH.dmg"
            DMG_ROOT="dist/dmg-root-$ARCH"

            ditto -c -k --sequesterRsrc --keepParent \
              "$APP_PATH" \
              "dist/update/$ARCHIVE_NAME"

            mkdir -p "$DMG_ROOT"
            ditto "$APP_PATH" "$DMG_ROOT/$APP_NAME.app"
            ln -s /Applications "$DMG_ROOT/Applications"
            hdiutil create \
              -volname "大佐翻译官 v$VERSION $ARCH" \
              -srcfolder "$DMG_ROOT" \
              -ov \
              -format UDZO \
              "dist/$DMG_NAME"

            rm -rf "$DMG_ROOT"

          done

      - name: Generate signed Sparkle appcast
        if: github.event_name == 'workflow_dispatch'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "仓库缺少 SPARKLE_PRIVATE_KEY Secret。" >&2
            exit 1
          fi

          GENERATE_APPCAST="$(
            find "$DERIVED_DATA_PATH/SourcePackages/artifacts" \
              -type f \
              -path '*/Sparkle/bin/generate_appcast' \
              -print \
              -quit
          )"

          if [ -z "$GENERATE_APPCAST" ]; then
            echo "找不到 Sparkle generate_appcast 工具。" >&2
            exit 1
          fi

          python3 - "$RELEASE_VERSION" CHANGELOG.md dist/release-notes.md <<'PY'
          import re
          import sys
          from pathlib import Path

          version, changelog_path, output_path = sys.argv[1:]
          changelog = Path(changelog_path).read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^## {re.escape(version)}(?:\s+-[^\n]*)?\n(?P<body>.*?)(?=^##\s|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(changelog)
          if match is None:
              raise SystemExit(f"CHANGELOG.md 中找不到版本 {version} 的发布日志。")

          body = match.group("body").strip()
          if not body:
              raise SystemExit(f"版本 {version} 的发布日志为空。")

          Path(output_path).write_text(
              f"## 大佐翻译官 v{version}\n\n{body}\n\n"
              "- 分别提供 Apple Silicon（arm64）和 Intel（x86_64）安装包。\n"
              "- 主程序使用作者的 Apple Development 证书签名（非 Developer ID），未经过 Apple 公证；更新包继续通过 Sparkle EdDSA 签名验证。\n",
              encoding="utf-8",
          )
          PY

          for ARCH in arm64 x86_64; do
            APPCAST_INPUT="$RUNNER_TEMP/appcast-$ARCH"
            mkdir -p "$APPCAST_INPUT"
            cp \
              "dist/update/bagayalu-translate-v$RELEASE_VERSION-$ARCH.zip" \
              "$APPCAST_INPUT/"

            cp \
              dist/release-notes.md \
              "$APPCAST_INPUT/bagayalu-translate-v$RELEASE_VERSION-$ARCH.md"

            printf '%s' "$SPARKLE_PRIVATE_KEY" |
              "$GENERATE_APPCAST" \
                --ed-key-file - \
                --download-url-prefix \
                "https://github.com/Achordchan/bagayalu-translate/releases/download/v$RELEASE_VERSION/" \
                --link \
                "https://github.com/Achordchan/bagayalu-translate" \
                --embed-release-notes \
                --maximum-deltas 0 \
                "$APPCAST_INPUT"

            test -f "$APPCAST_INPUT/appcast.xml"
          done

          python3 - \
            "$RUNNER_TEMP/appcast-arm64/appcast.xml" \
            "$RUNNER_TEMP/appcast-x86_64/appcast.xml" \
            "dist/update/appcast.xml" <<'PY'
          import re
          import sys
          from pathlib import Path

          arm_appcast = Path(sys.argv[1]).read_text(encoding="utf-8")
          x86_appcast = Path(sys.argv[2]).read_text(encoding="utf-8")
          output_path = Path(sys.argv[3])

          x86_item = re.search(r"<item>.*?</item>", x86_appcast, re.DOTALL)
          if x86_item is None:
              raise SystemExit("x86_64 appcast 中找不到更新项。")

          channel_end = "</channel>"
          if arm_appcast.count(channel_end) != 1:
              raise SystemExit("arm64 appcast 的 channel 结构异常。")

          merged = arm_appcast.replace(
              channel_end,
              f"{x86_item.group(0)}\n    {channel_end}",
          )
          output_path.write_text(merged, encoding="utf-8")
          PY

          test -f dist/update/appcast.xml
          xmllint --noout dist/update/appcast.xml

          ITEM_COUNT="$(xmllint --xpath 'count(/rss/channel/item)' dist/update/appcast.xml)"
          SIGNATURE_COUNT="$(grep -o 'sparkle:edSignature=' dist/update/appcast.xml | wc -l | tr -d ' ')"
          FIRST_URL="$(xmllint --xpath 'string(/rss/channel/item[1]/enclosure/@url)' dist/update/appcast.xml)"
          SECOND_URL="$(xmllint --xpath 'string(/rss/channel/item[2]/enclosure/@url)' dist/update/appcast.xml)"
          ARM_REQUIREMENT="$(xmllint --xpath 'string(/rss/channel/item[1]/*[local-name()="hardwareRequirements"])' dist/update/appcast.xml)"

          [ "$ITEM_COUNT" = "2" ]
          [ "$SIGNATURE_COUNT" = "2" ]
          [[ "$FIRST_URL" == *"bagayalu-translate-v$RELEASE_VERSION-arm64.zip" ]]
          [[ "$SECOND_URL" == *"bagayalu-translate-v$RELEASE_VERSION-x86_64.zip" ]]
          [ "$ARM_REQUIREMENT" = "arm64" ]

      - name: Upload build artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: 大佐翻译官-macOS
          path: |
            dist/*.dmg
            dist/release-notes.md
            dist/update/*
          if-no-files-found: error

  release-macos:
    name: Create GitHub Release
    if: github.event_name == 'workflow_dispatch'
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: 大佐翻译官-macOS
          path: dist

      - name: Create Tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t DMGS < <(find dist -type f -name '*.dmg' | sort)
          mapfile -t ZIPS < <(find dist -type f -name '*.zip' | sort)
          APPCAST="$(find dist -type f -name 'appcast.xml' | head -1)"
          RELEASE_NOTES="$(find dist -type f -name 'release-notes.md' | head -1)"

          if [ ${#DMGS[@]} -eq 0 ] || [ ${#ZIPS[@]} -eq 0 ] || [ -z "$APPCAST" ] || [ -z "$RELEASE_NOTES" ]; then
            echo "发布产物不完整。" >&2
            find dist -type f -print >&2 || true
            exit 1
          fi

          # appcast 仅在 workflow_dispatch 的 build job 生成；push 构建不进入此 job。
          gh release create "v$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "大佐翻译官 v$RELEASE_VERSION" \
            --notes-file "$RELEASE_NOTES" \
            "${DMGS[@]}" \
            "${ZIPS[@]}" \
            "$APPCAST"
